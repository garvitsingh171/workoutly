name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Skip server tests temporarily
        run: echo "Skipping backend tests"

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Skip frontend tests temporarily
        run: echo "Skipping frontend tests"